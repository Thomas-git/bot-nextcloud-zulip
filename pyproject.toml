[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-nextcloud-zulip"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "zulip>=0.9.0",
    "python-dotenv==1.0.1",
    "requests>=2.32.0",
    "dateparser>=1.2.0",
]

[project.scripts]
bot = "src.bot:main"

[tool.setuptools.packages.find]
where = ["."]
