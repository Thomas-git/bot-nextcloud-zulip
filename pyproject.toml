[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bot-nextcloud-zulip"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "zulip>=0.9.0",
    "webdavclient3>=3.14.6",
    "flask>=3.1.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
]

[project.scripts]
bot = "src.bot:main"

[tool.setuptools.packages.find]
where = ["."]
